group = 'io.quickjs_engine'
version = '0.1.0'

buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Must match host app AGP (android/settings.gradle.kts). AGP 7.x cannot
        // evaluate on Gradle 9 — IDE imports of this folder fail with
        // DependencyHandler.module(...) missing-method errors.
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
// Required while the host app opts out of AGP built-in Kotlin
// (android.builtInKotlin=false). Remove when migrating to built-in Kotlin.
apply plugin: 'kotlin-android'

android {
    namespace 'io.quickjs_engine'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17', '-DCONFIG_VERSION=\\"ng-0.14.0\\"'
                cFlags '-std=c11', '-DCONFIG_VERSION=\\"ng-0.14.0\\"',
                        '-Wno-unused-function', '-Wno-unused-variable',
                        '-Wno-unused-parameter', '-Wno-unused-but-set-variable'
                arguments '-DANDROID_STL=c++_static'
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path '../native/CMakeLists.txt'
        }
    }
}

dependencies {
}
