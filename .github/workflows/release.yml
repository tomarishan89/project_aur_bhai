name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v3.12)'
        required: true
        default: 'v3.12'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Smoke Tests
        run: flutter test test/fast_path_routing_test.dart test/qr_dashboard_url_test.dart

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare Release Artifact
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/aur-bhai-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/aur-bhai-latest.apk"
          echo "Built artifact: dist/aur-bhai-${TAG}.apk and dist/aur-bhai-latest.apk"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Project Aur Bhai ${{ github.ref_name || github.event.inputs.tag_name }}"
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
